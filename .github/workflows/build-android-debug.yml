name: Build NeuralBridge Chinese Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Simplified Chinese UI localization
        run: python3 android/tools/localize_zh_cn.py

      - name: Guard protocol identifiers
        run: |
          grep -q '"ALL"' android/app/src/main/kotlin/com/neuralbridge/companion/MainActivity.kt
          grep -q 'MCP:' android/app/src/main/kotlin/com/neuralbridge/companion/MainActivity.kt

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          find android -type f -name '*.apk' -print
          test -n "$(find android -type f -name '*.apk' -print -quit)"

      - name: Upload Chinese APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuralBridge-zh-CN-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
